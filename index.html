<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Scratch is a local-first notes workspace. Everything you write stays on this device." />
        <meta name="color-scheme" content="dark light" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100d0a" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6ef" />
        <title>Scratch</title>
        <script>
            // Applied before first paint so the app never flashes the wrong theme.
            try {
                const saved = localStorage.getItem('scratch:theme') || 'dark';
                const dark =
                    saved === 'dark' ||
                    (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            } catch (e) {
                document.documentElement.dataset.theme = 'dark';
            }
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
